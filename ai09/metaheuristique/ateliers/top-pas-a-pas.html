<style>
/* Layout : carte quadrillée (comme les figures d'annales) à gauche, panneau d'explication à droite, lecteur pas à pas dessous */
:root {
  --bg: #f5f7fa; --surface: #ffffff; --fg: #18202b; --muted: #5d6878; --line: #d9dfe7;
  --grid: #e3e8ef; --grid-strong: #c9d2de;
  --accent: #2f5bd3; --v1: #2f5bd3; --v2: #d9640f; --v3: #12866b; --v4: #9b3fbf;
  --off: #b3bcc8; --bad: #cf2e3e; --good: #198754; --warn-bg: #fff4e5;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141b; --surface: #171e28; --fg: #e6ebf2; --muted: #98a3b3; --line: #2a3442;
  --grid: #1d2632; --grid-strong: #2b3747;
  --accent: #7ea2ff; --v1: #7ea2ff; --v2: #ff9a4d; --v3: #3fcca5; --v4: #cf8cf0;
  --off: #4f5b6b; --bad: #ff6b78; --good: #4cc98a; --warn-bg: #2a2114; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #171e28; --fg: #e6ebf2; --muted: #98a3b3; --line: #2a3442;
  --grid: #1d2632; --grid-strong: #2b3747;
  --accent: #7ea2ff; --v1: #7ea2ff; --v2: #ff9a4d; --v3: #3fcca5; --v4: #cf8cf0;
  --off: #4f5b6b; --bad: #ff6b78; --good: #4cc98a; --warn-bg: #2a2114; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
h1 { font-family: var(--f-display); font-size: 1.7rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 0.92rem; }
.sub b { font-family: var(--f-mono); font-weight: 500; color: var(--fg); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font: 500 0.88rem var(--f-body); padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }

.map { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.map svg { display: block; width: 100%; height: auto; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.8rem; color: var(--muted); padding: 6px 4px 2px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 0; border-top: 3px solid; display: inline-block; }
.sw.dash { border-top-style: dashed; border-top-width: 2px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.panel { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.stephead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { font: 600 0.72rem var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--chip, var(--accent)) 16%, transparent); color: var(--chip, var(--accent)); }
.count { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); margin-left: auto; }
.steptitle { font-family: var(--f-display); font-size: 1.2rem; margin: 8px 0 4px; text-wrap: balance; }
.steptext { margin: 0; max-width: 62ch; }

.label { font: 600 0.72rem var(--f-body); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.profit { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.profit .big { font-family: var(--f-mono); font-size: 2rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.profit .ref { color: var(--muted); font-size: 0.88rem; }
.pbar { position: relative; height: 10px; background: var(--grid); border-radius: 5px; margin-top: 8px; overflow: hidden; }
.pbar i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 5px; transition: width .35s ease; }

.veh { display: grid; grid-template-columns: 92px minmax(0, 1fr) 96px; gap: 4px 10px; align-items: center; font-size: 0.86rem; }
.veh .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tbar { position: relative; height: 14px; background: var(--grid); border-radius: 4px; overflow: hidden; }
.tbar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; transition: width .35s ease; }
.veh .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; font-size: 0.8rem; }
.veh .seq { grid-column: 2 / 4; font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; overflow-wrap: anywhere; }
.unserved { font-family: var(--f-mono); font-size: 0.84rem; color: var(--muted); }

.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.84rem; }
th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { font-weight: 600; color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: .05em; }
td { font-family: var(--f-mono); }
th:first-child, td:first-child { text-align: left; }
tr.win td { color: var(--good); font-weight: 600; }
.hint { font-size: 0.8rem; color: var(--muted); margin: 6px 0 0; }

.player { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ctrls button { font: 600 0.9rem var(--f-body); min-width: 44px; height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
.ctrls button.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); min-width: 110px; }
.ctrls label { font-size: 0.82rem; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
.ctrls .toggle { margin-left: 0; }
.timeline { display: flex; gap: 3px; flex-wrap: wrap; }
.timeline button { flex: 1 1 14px; min-width: 14px; max-width: 48px; height: 18px; border-radius: 3px; border: 0; cursor: pointer;
  background: color-mix(in srgb, var(--c) 30%, var(--grid)); padding: 0; }
.timeline button.on { background: var(--c); outline: 2px solid var(--fg); outline-offset: 1px; }
.timeline button.past { background: color-mix(in srgb, var(--c) 70%, var(--grid)); }
.phases { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.76rem; color: var(--muted); }
.phases span { display: inline-flex; gap: 5px; align-items: center; }

/* SVG */
.gridl { stroke: var(--grid); stroke-width: 0.03; }
.gridl.ax { stroke: var(--grid-strong); }
.axlbl { fill: var(--muted); font: 0.32px var(--f-mono); }
.node circle { stroke: var(--surface); stroke-width: 0.06; }
.node text.id { fill: var(--surface); font: 600 0.34px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.node text.p { fill: var(--muted); font: 500 0.28px var(--f-mono); }
.node.off text.id { fill: var(--fg); }
.depot rect { fill: var(--fg); }
.depot text { fill: var(--bg); font: 700 0.3px var(--f-body); text-anchor: middle; dominant-baseline: central; }
.route { fill: none; stroke-width: 0.075; stroke-linejoin: round; stroke-linecap: round; }
.removed { stroke: var(--bad); stroke-width: 0.06; stroke-dasharray: 0.15 0.12; fill: none; }
.added { fill: none; stroke-width: 0.17; stroke-linecap: round; opacity: 0.35; }
.giant { stroke: var(--muted); stroke-width: 0.04; stroke-dasharray: 0.12 0.1; fill: none; }
.gnum { fill: var(--muted); font: 0.22px var(--f-mono); }
.plne { fill: none; stroke: var(--good); stroke-width: 0.05; stroke-dasharray: 0.04 0.1; stroke-linecap: round; }
.focus { fill: none; stroke: var(--bad); stroke-width: 0.06; }
@media (prefers-reduced-motion: no-preference) { .focus { animation: pulse 1.2s ease-in-out infinite; } .tbar i, .pbar i { transition: width .35s ease; } }
@media (prefers-reduced-motion: reduce) { .tbar i, .pbar i { transition: none; } }
@keyframes pulse { 50% { stroke-opacity: 0.25; } }

r le véhicule 2", "text": "Les arêtes (5,12) et (6,a) se croisent ou sont mal ordonnées. On les remplace par (5,6) et (12,a) en inversant le morceau entre les deux. Gain de temps : 2.09. Le profit ne change pas, mais on libère du temps.", "routes": [[3, 11, 1, 9, 2, 8], [10, 5, 6, 7, 12]], "times": [22.258, 22.588], "profit": 190.0, "focus": [], "removed": [[5, 12], [6, 13]], "added": [[5, 6], [12, 13]], "candidates": null, "giant": null}, {"phase": "2-opt", "title": "2-opt sur le véhicule 2", "text": "Les arêtes (d,10) et (5,6) se croisent ou sont mal ordonnées. On les remplace par (d,5) et (10,6) en inversant le morceau entre les deux. Gain de temps : 0.50. Le profit ne change pas, mais on libère du temps.", "routes": [[3, 11, 1, 9, 2, 8], [5, 10, 6, 7, 12]], "times": [22.258, 22.086], "profit": 190.0, "focus": [], "removed": [[0, 10], [5, 6]], "added": [[0, 5], [10, 6]], "candidates": null, "giant": null}, {"phase": "Remplacement", "title": "Remplace le client 11 par le client 4", "text": "On retire le client 11 (P = 20) et on met à la place le client non servi 4 (P = 25), la tournée reste ≤ L. Profit : 190 → 195.", "routes": [[3, 1, 9, 2, 4, 8], [5, 10, 6, 7, 12]], "times": [23.515, 22.086], "profit": 195.0, "focus": [4, 11], "removed": [], "added": [], "candidates": null, "giant": null}, {"phase": "Fin", "title": "Optimum local atteint", "text": "Plus aucun mouvement n'améliore la solution. Profit final : 195.", "routes": [[3, 1, 9, 2, 4, 8], [5, 10, 6, 7, 12]], "times": [23.515, 22.086], "profit": 195.0, "focus": [], "removed": [], "added": [], "candidates": null, "giant": null}]}]};
const inst = DATA.instance;
const NS = "http://www.w3.org/2000/svg";
const VCOL = ["var(--v1)", "var(--v2)", "var(--v3)", "var(--v4)"];
const PHASE_COL = { "Construction": "var(--accent)", "Recherche locale": "var(--muted)", "2-opt": "var(--v3)",
  "Insertion": "var(--good)", "Remplacement": "var(--v4)", "Déplacement": "var(--v2)", "Échange": "var(--v2)", "Fin": "var(--fg)" };
const optimum = DATA.plne.profit;
let sc = 0, st = 0, timer = null;

const $ = id => document.getElementById(id);
const X = i => inst.coords[i][0], Y = i => 10 - inst.coords[i][1];   // y vers le haut
const lbl = i => i === inst.d ? "d" : i === inst.a ? "a" : String(i);
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

$("sub").innerHTML = `Instance de test : <b>n = ${inst.n}</b> clients, <b>m = ${inst.m}</b> véhicules, <b>L = ${inst.L}</b>, départ et arrivée au même point. Profit optimal (PLNE) : <b>${optimum}</b>.`;

// onglets
DATA.scenarios.forEach((s, k) => {
  const b = document.createElement("button");
  b.textContent = s.label; b.id = "tab-" + s.key;
  b.onclick = () => { sc = k; st = 0; stop(); render(); };
  $("tabs").appendChild(b);
});

// légende
$("legend").innerHTML =
  Array.from({ length: inst.m }, (_, k) => `<span><i class="sw" style="border-color:${VCOL[k]}"></i>Véhicule ${k + 1}</span>`).join("") +
  `<span><i class="dot" style="background:var(--off)"></i>Non servi</span>` +
  `<span><i class="sw dash" style="border-color:var(--bad)"></i>Arc supprimé</span>` +
  `<span><i class="sw dash" style="border-color:var(--muted)"></i>Tour géant</span>` +
  `<span><i class="sw dash" style="border-color:var(--good)"></i>Optimum PLNE</span>` +
  `<span>Taille du disque = profit</span>`;

// phases (légende de la frise)
const phasesUsed = [...new Set(DATA.scenarios.flatMap(s => s.steps.map(x => x.phase)))];
$("phases").innerHTML = phasesUsed.map(p => `<span><i class="dot" style="background:${PHASE_COL[p] || "var(--accent)"}"></i>${p}</span>`).join("");

function arrowMarkers(defs) {
  VCOL.forEach((c, k) => {
    const m = el("marker", { id: "arr" + k, viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "4.5", markerHeight: "4.5", orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", style: `fill:${c}` }, m);
  });
}

// point de fin d'un arc raccourci pour ne pas entrer dans le disque
function radius(i) { return (i === inst.d || i === inst.a) ? 0.32 : 0.16 + 0.045 * Math.sqrt(inst.P[i]); }
function seg(i, j, shrinkEnd = true) {
  const x1 = X(i), y1 = Y(i), x2 = X(j), y2 = Y(j);
  const L = Math.hypot(x2 - x1, y2 - y1) || 1;
  const r1 = radius(i) + 0.04, r2 = shrinkEnd ? radius(j) + 0.08 : 0;
  return [x1 + (x2 - x1) * r1 / L, y1 + (y2 - y1) * r1 / L, x2 - (x2 - x1) * r2 / L, y2 - (y2 - y1) * r2 / L];
}

function drawMap(step) {
  const svg = $("svg"); svg.innerHTML = "";
  const defs = el("defs", {}, svg); arrowMarkers(defs);
  // quadrillage unitaire (comme les figures d'annales)
  for (let v = 0; v <= 10; v++) {
    el("line", { x1: v, y1: 0, x2: v, y2: 10, class: "gridl" + (v === 0 ? " ax" : "") }, svg);
    el("line", { x1: 0, y1: v, x2: 10, y2: v, class: "gridl" + (v === 10 ? " ax" : "") }, svg);
    if (v % 2 === 0) {
      el("text", { x: v, y: 10.55, class: "axlbl", "text-anchor": "middle" }, svg).textContent = v;
      el("text", { x: -0.35, y: 10 - v + 0.1, class: "axlbl", "text-anchor": "end" }, svg).textContent = v;
    }
  }
  const served = new Map();
  step.routes.forEach((r, k) => r.forEach(i => served.set(i, k)));

  // tour géant
  if (step.giant) {
    const pts = [inst.d, ...step.giant].map(i => `${X(i)},${Y(i)}`).join(" ");
    el("polyline", { points: pts, class: "giant" }, svg);
    step.giant.forEach((i, q) => {
      const t = el("text", { x: X(i) + radius(i) + 0.05, y: Y(i) + radius(i) + 0.18, class: "gnum" }, svg); t.textContent = "#" + (q + 1);
    });
  }
  // optimum PLNE
  if ($("showplne").checked) {
    DATA.plne.routes.forEach(r => {
      const p = [inst.d, ...r, inst.a].map(i => `${X(i)},${Y(i)}`).join(" ");
      el("polyline", { points: p, class: "plne" }, svg);
    });
  }
  // arcs supprimés
  step.removed.forEach(([i, j]) => { const [a, b, c, d] = seg(i, j, false); el("line", { x1: a, y1: b, x2: c, y2: d, class: "removed" }, svg); });
  // halo des arcs ajoutés
  step.added.forEach(([i, j]) => {
    const k = served.get(i) ?? served.get(j) ?? 0;
    const [a, b, c, d] = seg(i, j, false); el("line", { x1: a, y1: b, x2: c, y2: d, class: "added", style: `stroke:${VCOL[k]}` }, svg);
  });
  // tournées
  step.routes.forEach((r, k) => {
    const path = [inst.d, ...r, inst.a];
    for (let q = 0; q < path.length - 1; q++) {
      if (path[q] === path[q + 1]) continue;
      const [a, b, c, d] = seg(path[q], path[q + 1]);
      el("line", { x1: a, y1: b, x2: c, y2: d, class: "route", style: `stroke:${VCOL[k]}`, "marker-end": `url(#arr${k})` }, svg);
    }
  });
  // clients
  inst.clients = inst.clients || Array.from({ length: inst.n }, (_, q) => q + 1);
  inst.clients.forEach(i => {
    const g = el("g", { class: "node" + (served.has(i) ? "" : " off") }, svg);
    const col = served.has(i) ? VCOL[served.get(i)] : "var(--off)";
    el("circle", { cx: X(i), cy: Y(i), r: radius(i), style: `fill:${col}` }, g);
    el("text", { x: X(i), y: Y(i), class: "id" }, g).textContent = i;
    el("text", { x: X(i) + radius(i) + 0.06, y: Y(i) - radius(i) + 0.02, class: "p" }, g).textContent = "P" + inst.P[i];
    if (step.focus.includes(i)) el("circle", { cx: X(i), cy: Y(i), r: radius(i) + 0.14, class: "focus" }, svg);
  });
  // dépôt
  const g = el("g", { class: "depot" }, svg);
  el("rect", { x: X(inst.d) - 0.3, y: Y(inst.d) - 0.3, width: 0.6, height: 0.6, rx: 0.08 }, g);
  el("text", { x: X(inst.d), y: Y(inst.d) }, g).textContent = "d=a";
}

function render() {
  const S = DATA.scenarios[sc], step = S.steps[st];
  document.querySelectorAll("#tabs button").forEach((b, k) => b.setAttribute("aria-pressed", k === sc));
  drawMap(step);
  const chip = $("chip"); chip.textContent = step.phase; chip.style.setProperty("--chip", PHASE_COL[step.phase] || "var(--accent)");
  $("count").textContent = `étape ${st + 1} / ${S.steps.length}`;
  $("title").textContent = step.title;
  $("text").textContent = step.text;
  $("profit").textContent = step.profit;
  const gap = optimum - step.profit;
  $("pref").textContent = gap <= 1e-9 ? `= optimum PLNE (${optimum})` : `optimum PLNE : ${optimum} (écart ${gap})`;
  $("pbar").style.width = (100 * step.profit / optimum) + "%";
  $("veh").innerHTML = step.routes.map((r, k) => {
    const t = step.times[k], over = t > inst.L + 1e-6, pc = Math.min(100, 100 * t / inst.L);
    const prof = r.reduce((s, i) => s + inst.P[i], 0);
    return `<span class="name"><i class="dot" style="background:${VCOL[k]}"></i>Véh. ${k + 1}</span>
      <span class="tbar" title="${t.toFixed(2)} / ${inst.L}"><i style="width:${pc}%;background:${over ? "var(--bad)" : VCOL[k]}"></i></span>
      <span class="num">${t.toFixed(2)} / ${inst.L}</span>
      <span class="seq">d → ${r.length ? r.join(" → ") : "(vide)"} → a · profit ${prof}</span>`;
  }).join("");
  const served = new Set(step.routes.flat());
  const un = Array.from({ length: inst.n }, (_, q) => q + 1).filter(i => !served.has(i));
  $("unserved").textContent = un.length ? `Non servis : ${un.map(i => `${i} (P${inst.P[i]})`).join(", ")}` : "Tous les clients sont servis.";
  const cc = $("candcard");
  if (step.candidates && step.candidates.length) {
    cc.hidden = false;
    $("cand").innerHTML = `<thead><tr><th>Client</th><th>P</th><th>Détour</th><th>Ratio</th></tr></thead><tbody>` +
      step.candidates.map((c, q) => `<tr class="${q === 0 ? "win" : ""}"><td>${c.j}${q === 0 ? " ✓" : ""}</td><td>${c.P}</td><td>${c.delta.toFixed(2)}</td><td>${c.score.toFixed(2)}</td></tr>`).join("") + `</tbody>`;
  } else cc.hidden = true;
  // frise
  const tl = $("timeline"); tl.innerHTML = "";
  S.steps.forEach((x, q) => {
    const b = document.createElement("button");
    b.style.setProperty("--c", PHASE_COL[x.phase] || "var(--accent)");
    b.className = q === st ? "on" : q < st ? "past" : "";
    b.title = `${q + 1}. ${x.title}`; b.setAttribute("aria-label", b.title);
    b.onclick = () => { st = q; stop(); render(); };
    tl.appendChild(b);
  });
  $("play").textContent = timer ? "❚❚ Pause" : (st === S.steps.length - 1 ? "↺ Rejouer" : "▶ Lecture");
}

function go(d) { const n = DATA.scenarios[sc].steps.length; st = Math.max(0, Math.min(n - 1, st + d)); render(); }
function stop() { if (timer) { clearInterval(timer); timer = null; } }
function play() {
  const n = DATA.scenarios[sc].steps.length;
  if (timer) { stop(); render(); return; }
  if (st === n - 1) st = 0;
  timer = setInterval(() => { if (st >= DATA.scenarios[sc].steps.length - 1) { stop(); render(); return; } go(1); }, +$("speed").value);
  render();
}
$("first").onclick = () => { stop(); st = 0; render(); };
$("last").onclick = () => { stop(); st = DATA.scenarios[sc].steps.length - 1; render(); };
$("prev").onclick = () => { stop(); go(-1); };
$("next").onclick = () => { stop(); go(1); };
$("play").onclick = play;
$("speed").oninput = () => { if (timer) { stop(); play(); } };
$("showplne").onchange = render;
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") { stop(); go(1); }
  else if (e.key === "ArrowLeft") { stop(); go(-1); }
  else if (e.key === " ") { e.preventDefault(); play(); }
});
render();
</script>
